# This updates the EXISTING UndefinedType Render service.
# The free PostgreSQL database is separate from the web service and
# makes account passwords and global Elo persist across web redeploys.
services:
  - type: web
    name: undefinedtype
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: undefinedtype-db
          property: connectionString

databases:
  - name: undefinedtype-db
    plan: free
    databaseName: undefinedtype
    user: undefinedtype
